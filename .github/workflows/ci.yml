name: Validate macOS ARM64 (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-validation-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.12'
      - name: Verify native ARM64 runner
        run: node -e 'if (process.platform !== "darwin" || process.arch !== "arm64") throw new Error("Expected darwin/arm64")'
      - run: bun install --frozen-lockfile
      # DEBUG BRANCH: skip unit/test:release to shorten the diagnosis cycle.
      - name: Build unsigned app and validate the bundled runtime
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: bun run package:mac:unsigned
      # trajectory-strip.spec.ts drives a Vite page in Chromium, not Electron.
      - name: Install Playwright Chromium
        run: bunx playwright install chromium
      # DEBUG BRANCH: only the annotation spec, 3 repeats, no early abort.
      - name: Test packaged app
        timeout-minutes: 15
        env:
          DEBUG: pw:browser
        run: |
          system_profiler SPDisplaysDataType
          bun run test:e2e:packaged:mac e2e/smoke/browser-surface.spec.ts --workers=1 --repeat-each=3 --reporter=line
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
