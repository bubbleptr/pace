appId: com.bubbleptr.pace
productName: Pace
electronVersion: 42.5.0
asar: true
compression: normal
forceCodeSigning: true
npmRebuild: false

directories:
  app: apps/desktop
  output: dist
  buildResources: build

files:
  - out/**/*
  - package.json
  # Main, preload, and renderer dependencies are bundled by electron-vite.
  - "!node_modules/**/*"
  # The one runtime exception: node-pty stays external (native N-API module)
  # and is staged as real files by scripts/stage-node-pty.mjs (bun only links
  # it into a store dir electron-builder cannot reach).
  - "node_modules/@lydell/**/*"

extraResources:
  - from: docs/licenses
    to: licenses
    filter:
      - "**/*.md"

# Native modules (pty.node) cannot be dlopen'd from inside the asar, and
# node-pty's spawn-helper is exec'd as a subprocess — unpack the whole scope.
asarUnpack:
  - "node_modules/@lydell/**/*"

artifactName: ${productName}-${version}-${arch}.${ext}

# Generates latest-mac.yml / app-update.yml for electron-updater.
# CI and local scripts still pass --publish never; uploads stay in publish-release.sh.
publish:
  provider: github
  owner: BubblePtr
  repo: pace

mac:
  icon: build/icon.icns
  extendInfo:
    CFBundleIconName: Pace
  extraResources:
    - from: build/Assets.car
      to: Assets.car
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  minimumSystemVersion: "12.0"

dmg:
  title: ${productName} ${version}
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# The global artifactName's ${arch} expands to x86_64 for AppImage and amd64
# for deb (builder-util getArtifactArchName). Release scripts, docs and the
# updater feed use -x64; only x64 is built, so pin the name per target.
appImage:
  artifactName: ${productName}-${version}-x64.${ext}
deb:
  artifactName: ${productName}-${version}-x64.${ext}

linux:
  # Global forceCodeSigning stays on for macOS. Linux has no signing identity
  # in CI; setting false here stops this platform from inheriting the global flag.
  forceCodeSigning: false
  # Point at the icns so electron-builder derives the full hicolor set
  # (16→512); a single PNG would install only that one size.
  icon: build/icon.icns
  # Without this, electron-builder falls back to the workspace package name
  # (`@pace/desktop` → `@pacedesktop`); see app-builder-lib linuxPackager.
  executableName: pace
  # Electron derives app_id / WM_CLASS from `desktopName` in the app package.json;
  # syncing keeps the installed .desktop filename and StartupWMClass matching, so
  # Wayland/X11 compositors associate the running window with the launcher entry.
  syncDesktopName: true
  maintainer: BubblePtr <102268132+BubblePtr@users.noreply.github.com>
  category: Development
  synopsis: Pace — The GUI for the Pi coding agent
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
